spring.application.name=interview-platform
server.port=8091
server.address=127.0.0.1
server.error.include-message=always
server.error.include-stacktrace=never

# Relative paths are resolved from the working directory, outside the JAR.
interview.data-file=./data/questions.json

# Required for add, edit, and delete. Change this if anyone else can reach the process.
interview.admin-key=local-admin

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
